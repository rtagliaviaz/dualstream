<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DualStream — WebRTC + HLS</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 1.5rem; }
  h1 { font-weight: 500; margin: 0 0 .5rem; }
  #status { font-family: monospace; font-size: .85rem; color: #8f8; margin-bottom: .75rem; min-height: 1.2em; }
  video { width: 100%; max-width: 960px; background: #000; border-radius: 6px; display: block; }
  .controls { margin-top: 1rem; display: flex; gap: .5rem; flex-wrap: wrap; }
  button { padding: .5rem .9rem; border: 1px solid #444; background: #222; color: #eee; border-radius: 4px; cursor: pointer; }
  button:hover { background: #333; }
  button.active { background: #2a5; border-color: #2a5; color: #000; }
  #mode-badge { display: inline-block; padding: .15rem .5rem; border-radius: 4px; font-size: .8rem; background: #444; margin-left: .5rem; }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
  <h1>DualStream <span id="mode-badge">disconnected</span></h1>
  <div id="status">Starting…</div>
  <video id="video" autoplay muted playsinline></video>
  <div class="controls">
    <button data-rid="h">High (720p)</button>
    <button data-rid="m">Medium (480p)</button>
    <button data-rid="l">Low (360p)</button>
    <button id="toggle-mode">Switch to HLS</button>
  </div>
  <script src="player.js?v=5"></script>
</body>
</html>
